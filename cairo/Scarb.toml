[package]
name = "crewkill"
version = "0.1.0"
edition = "2024_07"
license-file = "../LICENSE"
description = "CrewKill — staked social deduction on Starknet, settled through the STRK20 privacy pool"

[dependencies]
starknet = "2.15.0"

[dev-dependencies]
snforge_std = "0.56.0"
assert_macros = "2.15.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[profile.release.cairo]
inlining-strategy = 250

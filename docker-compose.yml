services:
  postgres:
    image: postgres:17-alpine
    container_name: crewkill-postgres
    environment:
      POSTGRES_USER: crewkill
      POSTGRES_PASSWORD: crewkill
      POSTGRES_DB: crewkill
    ports:
      - "5433:5432"
    volumes:
      - crewkill-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewkill"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A real Starknet node with real accounts, real signatures and real receipts — just a
  # local chain. Used to run whole matches end to end without spending mainnet STRK.
  devnet:
    image: shardlabs/starknet-devnet-rs:0.7.2
    container_name: crewkill-devnet
    # The image already pins --host; passing it again is a hard error.
    command:
      - --seed
      - "42"
      - --accounts
      - "20"
      - --initial-balance
      - "1000000000000000000000"
    ports:
      - "5050:5050"
    # A long-running keeper mints a block per transaction; without a cap the archive grows
    # until the container is OOM-killed mid-match.
    mem_limit: 3g
    restart: unless-stopped

  keeper:
    build:
      context: .
      dockerfile: apps/keeper/Dockerfile
    container_name: crewkill-keeper
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crewkill:crewkill@postgres:5432/crewkill
      NETWORK: ${NETWORK:-devnet}
      DEVNET_RPC: http://devnet:5050/rpc
      PORT: "8080"
    ports:
      - "8080:8080"
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: crewkill-web
    depends_on:
      - keeper
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  crewkill-pg:
